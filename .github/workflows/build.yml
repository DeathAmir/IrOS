name: Build IrOS x86_64
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm grub-pc-bin grub-common grub-efi-amd64-bin mtools xorriso qemu-system-x86 curl python3-pil
      - name: Build bootable ISO and persistent disk
        run: make clean iso disk
      - name: Verify Multiboot2 kernel
        run: grub-file --is-x86-multiboot2 build/kernel.elf
      - name: QEMU persistence and network smoke boot
        run: make check
      - name: Upload IrOS image
        uses: actions/upload-artifact@v4
        with:
          name: IrOS-x86_64-QEMU
          path: |
            build/IrOS.iso
            build/IrOS.disk
            build/kernel.elf
            build/serial.log
            build/serial-first.log
          if-no-files-found: error
