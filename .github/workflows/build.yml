name: Build IrOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib binutils nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build bootable ISO
        run: make clean iso

      - name: QEMU smoke boot
        run: make check

      - name: Upload IrOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: IrOS-QEMU-x86
          path: |
            build/IrOS.iso
            build/kernel.elf
            build/serial.log
          if-no-files-found: error
          retention-days: 30
